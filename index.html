    <script>
        // --- LOGIQUE AUTOMATISATION ---
        
        // Nouvelle fonction de clic pour les billes du bas
        function clickBottomBead(colId, index) {
            const col = columns.find(c => c.id === colId);
            const colIndex = columns.findIndex(c => c.id === colId);
            
            // Logique de basculement
            if (index >= col.bottomCount) {
                col.bottomCount = index + 1;
            } else {
                col.bottomCount = index;
            }

            // Automatisme : Si 5 unaires -> 1 quinaire
            if (col.bottomCount >= 5) {
                col.bottomCount -= 5;
                if (!col.top1) col.top1 = true;
                else if (!col.top0) { col.top0 = true; col.top1 = true; }
            }
            
            refreshAllVisuals();
            checkCurrentState();
        }

        // Nouvelle fonction pour les billes du haut (Quinaires)
        // Utilisation d'un double-clic (ondblclick) pour la décomposition
        function clickTopBead(colId, idx) {
            const col = columns.find(c => c.id === colId);
            const colIndex = columns.findIndex(c => c.id === colId);

            // Clic simple : classique
            // Double clic : Décomposition
        }

        // --- Logique de cascade ---
        function checkCascade(colIndex) {
            const col = columns[colIndex];
            
            // Cas : 2 quinaires actives -> monte au rang supérieur
            if (col.top0 && col.top1) {
                col.top0 = false;
                col.top1 = false;
                if (colIndex < columns.length - 1) {
                    columns[colIndex + 1].bottomCount++;
                    // Appeler récursivement si besoin
                    checkCascade(colIndex + 1);
                }
            }
            refreshAllVisuals();
        }

        // --- Logique de décomposition (Anti-boucle infinie) ---
        function decomposeUpper(colIndex) {
            if (colIndex <= 0) return;
            const col = columns[colIndex];
            const lowerCol = columns[colIndex - 1];

            if (col.bottomCount > 0) {
                col.bottomCount--;
                // On met un flag pour dire "c'est une décomposition, ne pas recompter"
                lowerCol.top0 = true;
                lowerCol.top1 = true;
                refreshAllVisuals();
            }
        }

        // Ajoutez ces événements aux billes
