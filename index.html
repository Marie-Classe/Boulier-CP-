<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Boulier CP - Ciseaux Pédagogiques</title>
    <style>
        :root { --frame-libre: #2ecc71; --bead-top-active: #c0392b; --bead-bottom-active: #2557A7; }
        body { display: flex; flex-direction: column; align-items: center; background: #f0f4f8; font-family: sans-serif; }
        
        .abacus-frame { 
            background: #fff; border: 12px solid var(--frame-libre); border-radius: 20px;
            width: 320px; height: 420px; position: relative; margin-top: 20px;
        }

        /* Barre centrale avec ciseaux */
        .beam {
            position: absolute; top: 130px; left: 0; right: 0; height: 40px;
            background-color: #2c3e50; z-index: 10; display: flex; align-items: center; justify-content: space-around;
        }
        .tool-btn { 
            background: #ecf0f1; border: 2px solid #95a5a6; border-radius: 5px; cursor: pointer; padding: 5px; font-size: 1rem;
        }
        .tool-btn.active { background: #f1c40f; border-color: #d35400; }

        .column { position: relative; width: 70px; height: 100%; display: inline-block; }
        .rod { position: absolute; top: 0; bottom: 0; left: 32px; width: 6px; background: #ddd; z-index: 1; }
        .bead { width: 60px; height: 28px; border-radius: 15px; position: absolute; left: 5px; z-index: 5; transition: top 0.3s ease; }
        .bead.top { background-color: #6b0000; }
        .bead.top.active { background-color: var(--bead-top-active); }
        .bead.bottom { background-color: #2c3a47; }
        .bead.bottom.active { background-color: var(--bead-bottom-active); }
    </style>
</head>
<body>

    <div class="abacus-frame">
        <div class="beam">
            <button class="tool-btn" id="btn-cut-q" onclick="toggleTool('q')">✂️ Quinaire</button>
            <button class="tool-btn" id="btn-cut-u" onclick="toggleTool('u')">✂️ Unaire</button>
        </div>
        <!-- Colonnes (C, D, U) -->
        <div class="column" id="col-2"><div class="rod"></div><div class="bead top" style="top:5px;" onclick="handleBeadClick('col-2', 'top', 0)"></div><div class="bead top" style="top:38px;" onclick="handleBeadClick('col-2', 'top', 1)"></div><div class="bead bottom" style="top:200px;" onclick="handleBeadClick('col-2', 'bottom', 0)"></div><div class="bead bottom" style="top:233px;" onclick="handleBeadClick('col-2', 'bottom', 1)"></div><div class="bead bottom" style="top:266px;" onclick="handleBeadClick('col-2', 'bottom', 2)"></div><div class="bead bottom" style="top:299px;" onclick="handleBeadClick('col-2', 'bottom', 3)"></div><div class="bead bottom" style="top:332px;" onclick="handleBeadClick('col-2', 'bottom', 4)"></div></div>
        <div class="column" id="col-1"><div class="rod"></div><div class="bead top" style="top:5px;" onclick="handleBeadClick('col-1', 'top', 0)"></div><div class="bead top" style="top:38px;" onclick="handleBeadClick('col-1', 'top', 1)"></div><div class="bead bottom" style="top:200px;" onclick="handleBeadClick('col-1', 'bottom', 0)"></div><div class="bead bottom" style="top:233px;" onclick="handleBeadClick('col-1', 'bottom', 1)"></div><div class="bead bottom" style="top:266px;" onclick="handleBeadClick('col-1', 'bottom', 2)"></div><div class="bead bottom" style="top:299px;" onclick="handleBeadClick('col-1', 'bottom', 3)"></div><div class="bead bottom" style="top:332px;" onclick="handleBeadClick('col-1', 'bottom', 4)"></div></div>
        <div class="column" id="col-0"><div class="rod"></div><div class="bead top" style="top:5px;" onclick="handleBeadClick('col-0', 'top', 0)"></div><div class="bead top" style="top:38px;" onclick="handleBeadClick('col-0', 'top', 1)"></div><div class="bead bottom" style="top:200px;" onclick="handleBeadClick('col-0', 'bottom', 0)"></div><div class="bead bottom" style="top:233px;" onclick="handleBeadClick('col-0', 'bottom', 1)"></div><div class="bead bottom" style="top:266px;" onclick="handleBeadClick('col-0', 'bottom', 2)"></div><div class="bead bottom" style="top:299px;" onclick="handleBeadClick('col-0', 'bottom', 3)"></div><div class="bead bottom" style="top:332px;" onclick="handleBeadClick('col-0', 'bottom', 4)"></div></div>
    </div>

    <script>
        let activeTool = null;
        const columns = [
            { id: "col-0", top0: false, top1: false, bottomCount: 0 },
            { id: "col-1", top0: false, top1: false, bottomCount: 0 },
            { id: "col-2", top0: false, top1: false, bottomCount: 0 }
        ];

        function toggleTool(type) {
            activeTool = (activeTool === type) ? null : type;
            document.getElementById('btn-cut-q').classList.toggle('active', activeTool === 'q');
            document.getElementById('btn-cut-u').classList.toggle('active', activeTool === 'u');
        }

        function handleBeadClick(colId, type, idx) {
            const col = columns.find(c => c.id === colId);
            const colIdx = columns.findIndex(c => c.id === colId);

            if (activeTool === 'q' && type === 'top') {
                // Décomposition quinaire -> 5 unaires même rang
                if (col.top0 || col.top1) {
                    if (col.top0) col.top0 = false; else col.top1 = false;
                    col.bottomCount += 5;
                    activeTool = null; toggleTool(null);
                }
            } else if (activeTool === 'u' && type === 'bottom' && idx === 0 && colIdx > 0) {
                // Décomposition unaire -> 2 quinaires rang inférieur (droite)
                if (col.bottomCount > 0) {
                    col.bottomCount -= 1;
                    columns[colIdx - 1].top0 = true;
                    columns[colIdx - 1].top1 = true;
                    activeTool = null; toggleTool(null);
                }
            } else {
                // Manipulation normale
                if (type === 'top') { if(idx===0) col.top0 = !col.top0; else col.top1 = !col.top1; }
                else { col.bottomCount = (col.bottomCount === idx + 1) ? idx : idx + 1; }
            }
            updateView();
        }

        function updateView() {
            columns.forEach(col => {
                const el = document.getElementById(col.id);
                // (Logique de mise à jour des positions CSS ici, similaire au code précédent)
                // ... animation de 300ms ...
            });
        }
    </script>
</body>
</html>
